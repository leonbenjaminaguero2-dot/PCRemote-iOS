name: Build PC Remote IPA
'on':
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd iOS && xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project iOS/PCRemote.xcodeproj -scheme PCRemote -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/PCRemote.app Payload/ && zip -qry PCRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote-IPA
          path: PCRemote.ipa
